services:
  db:
    image: postgres:16-alpine
    container_name: coingecko_db
    environment:
      POSTGRES_USER: coingecko_demo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coingecko_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coingecko_demo -d coingecko_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coingecko_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: "test"
    container_name: coingecko_web
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/rails
      - /rails/tmp
      - /rails/log
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://coingecko_demo:password@db:5432/coingecko_dev
      REDIS_URL: redis://redis:6379/1
      RAILS_LOG_TO_STDOUT: "true"
    restart: always

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: "test"
    container_name: coingecko_sidekiq
    command: ["bundle", "exec", "sidekiq"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/rails
      - /rails/tmp
      - /rails/log
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://coingecko_demo:password@db:5432/coingecko_dev
      REDIS_URL: redis://redis:6379/1
      RAILS_LOG_TO_STDOUT: "true"
    restart: always

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RAILS_ENV: development
        BUNDLE_WITHOUT: "test"
    container_name: coingecko_scheduler
    command: ["/bin/bash", "-c", "echo 'Starting price sync scheduler...'; while true; do ./bin/rails crypto_prices:refresh; sleep 60; done"]
    depends_on:
      redis:
        condition: service_healthy
      sidekiq:
        condition: service_started
    volumes:
      - .:/rails
      - /rails/tmp
      - /rails/log
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgresql://coingecko_demo:password@db:5432/coingecko_dev
      REDIS_URL: redis://redis:6379/1
      RAILS_LOG_TO_STDOUT: "true"
    restart: always

volumes:
  postgres_data:
  redis_data:
